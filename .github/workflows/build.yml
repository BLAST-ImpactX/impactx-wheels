name: wheels

on: [push, pull_request]

env:
  COMMON_PATCHES: '.github/setup-py-freethreaded-abi-impactx.patch'

jobs:
  build_wheels:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 64bit Linux
            os: ubuntu-24.04
            arch: "x86_64"
            env:
              SIMD: "ON"
              WHEEL_ARCHFLAGS: "-march=x86-64-v3 -mtune=generic"
              CMAKE_BUILD_PARALLEL_LEVEL: 4

          - name: 32bit Linux
            os: ubuntu-24.04
            arch: "i686"
            env:
              SIMD: "OFF"
              CMAKE_BUILD_PARALLEL_LEVEL: 4

          - name: 64bit Linux
            os: ubuntu-24.04-arm
            arch: "aarch64"
            env:
              SIMD: "ON"
              CMAKE_BUILD_PARALLEL_LEVEL: 4

          # builds faster on Travis-CI:
          # - name: 64bit Linux
          #   os: ubuntu-24.04
          #   arch: "ppc64le"
          #   env:
          #     CMAKE_BUILD_PARALLEL_LEVEL: 4

          # builds faster on Travis-CI:
          # blocked by https://github.com/GTkorvo/dill/issues/15
          #- name: 64bit Linux
          #  os: ubuntu-24.04
          #  arch: "s390x"
          #  env:
          #    CMAKE_BUILD_PARALLEL_LEVEL: 4

          # x86-64 (64bit)
          - name: 64bit Windows
            os: windows-2022
            arch: "AMD64"
            env:
              # Explicit SIMD (vir-simd) needs clang/gcc builtins, not MSVC, so SIMD stays OFF.
              # We still target AVX2 via MSVC codegen (/arch:AVX2): scalar FMA + auto-vectorization.
              SIMD: "OFF"
              WHEEL_ARCHFLAGS: "/arch:AVX2"
              CMAKE_BUILD_PARALLEL_LEVEL: 4

          # x86 (32bit)
          - name: 32bit Windows
            os: windows-2022
            arch: "x86"
            env:
              SIMD: "OFF"
              CMAKE_GENERATOR: "Visual Studio 17 2022"
              CMAKE_GENERATOR_PLATFORM: "Win32"
              CMAKE_BUILD_PARALLEL_LEVEL: 4

          - name: 64bit macOS
            os: macos-15-intel
            arch: "x86_64"
            env:
              SIMD: "ON"
              WHEEL_ARCHFLAGS: "-march=x86-64-v3 -mtune=generic"
              MACOSX_DEPLOYMENT_TARGET: 11.0
              CMAKE_BUILD_PARALLEL_LEVEL: 4

          # Apple Silicon M1/arm64/aarch64 builds:
          #   https://cibuildwheel.readthedocs.io/en/stable/faq/#apple-silicon
          #   https://github.com/pypa/cibuildwheel/pull/704
          - name: 64bit macOS
            os: macos-14
            arch: "arm64"
            env:
              SIMD: "ON"
              CMAKE_OSX_ARCHITECTURES: "arm64"
              MACOSX_DEPLOYMENT_TARGET: 11.0
              CMAKE_BUILD_PARALLEL_LEVEL: 3

          # Apple universal builds that contain x86-64 and arm64 binary code
          #   Needs extra treatment of all librarys that are not CMake
          #   controlled the dependencies:
          #   https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary
          # HDF5 tricky to build, even with CMake (as of 1.12)
          # We could build them twice and use `lipo` to combine the lib artifacts.
          #- name: 64bit macOS
          #  os: macos-15-intel
          #  arch: "universal2"
          #  env:
          #    CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
          #    MACOSX_DEPLOYMENT_TARGET: 11.0
          #    CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
    - uses: actions/checkout@v4
      with:
        repository: 'BLAST-ImpactX/impactx'
        path: 'src'
        ref: '26.08'

    - uses: actions/checkout@v4
      with:
        path: 'src/.github/'

    - name: Overwrite README & Distribution Package for PyPI
      run: |
        cp src/.github/README.md src/
        python src/.github/rename_package.py src/setup.py

    - uses: actions/setup-python@v5
      name: Install Python
      with:
        python-version: '3.11'

    - name: Install cibuildwheel
      run: |
        python -m pip install --upgrade pip build setuptools[core] wheel
        python -m pip install cibuildwheel==3.2.1

    # Source patches not (yet) in the built release tag.
    # Applies all matrix.patches (if any), then the $COMMON_PATCHES (if any).
    - name: Apply patches
      shell: bash
      run: |
        cd src
        for p in ${{ matrix.patches }} $COMMON_PATCHES; do
          git apply --ignore-whitespace "$p"
        done

#    # Patch: Fix versioning
#    - name: Download Patch 1/2
#      uses: suisei-cn/actions-download-file@818d6b7dc8fe73f2f924b6241f2b1134ca1377d9  # 1.6.0
#      id: setupversion
#      with:
#        url: "https://github.com/openPMD/openPMD-api/pull/1680.patch"
#        target: src/.patch/

#    # Patch: PYBIND11_FINDPYTHON=ON
#    - name: Download Patch 2/2
#      uses: suisei-cn/actions-download-file@818d6b7dc8fe73f2f924b6241f2b1134ca1377d9  # 1.6.0
#      id: setupfindpython
#      with:
#        url: "https://github.com/openPMD/openPMD-api/pull/1684.patch"
#        target: src/.patch/

#    - name: Apply Patches
#      run: |
#        cd src
#        git apply --exclude=.github/workflows/windows.yml .patch/1680.patch
#        git apply --exclude=cmake/dependencies/pybind11.cmake .patch/1684.patch
#        git fetch
#        git apply --exclude=setup.py -3 .patch/1684.patch

    - name: Build wheel
      env:
        # (1) Disable PyPy (manylinux image: yum repo issues)
        #     https://github.com/pypa/manylinux/issues/899
        # (2) Disable musl until this AMReX TODO is fixed:
        #     https://github.com/AMReX-Codes/amrex/issues/4373
        CIBW_SKIP: "pp*-manylinux* *musllinux*"
        CIBW_ARCHS: "${{ matrix.arch }}"
        CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
        # Install dependencies
        CIBW_BEFORE_BUILD_LINUX: bash -x .github/library_builders.sh
        CIBW_BEFORE_BUILD_MACOS: bash -x .github/library_builders.sh
        CIBW_BEFORE_BUILD_WINDOWS: 'cmd /E:ON /V:ON /C .github\library_builders.bat'
        # SIMD ('${{ matrix.env.SIMD }}') and the x86_64 march/mtune flags are set per matrix arch;
        # AMREX_SIMD drives the external AMReX build in library_builders.sh, IMPACTX_SIMD the wheel.
        # HDF5_USE_STATIC_LIBRARIES needs the IMPACTX_CMAKE_ prefix to reach CMake as a
        # real -D (setup.py only forwards that prefix); plain env vars are ignored by
        # find_package(HDF5). We build HDF5 static everywhere, so ON is the correct value.
        CIBW_ENVIRONMENT: IMPACTX_CMAKE_HDF5_USE_STATIC_LIBRARIES='ON' IMPACTX_AMREX_INTERNAL='OFF' IMPACTX_CMAKE_ImpactX_openpmd_internal='OFF' IMPACTX_COMPUTE='NOACC' IMPACTX_FFT='ON' IMPACTX_SIMD='${{ matrix.env.SIMD }}' AMREX_SIMD='${{ matrix.env.SIMD }}' CFLAGS='${{ matrix.env.WHEEL_ARCHFLAGS }}' CXXFLAGS='${{ matrix.env.WHEEL_ARCHFLAGS }}' ZLIB_USE_STATIC_LIBS='ON' PKG_CONFIG_PATH='/usr/local/lib64/pkgconfig;/usr/local/lib/pkgconfig'
        # ImpactX defaults Python IPO/LTO to ON unless CMAKE_INTERPROCEDURAL_OPTIMIZATION
        # is set explicitly. On Windows that ends up enabling /GL and /LTCG via pybind11,
        # which currently trips an MSVC ICE in src/python/WakeConvolution.cpp.
        # CFLAGS/CXXFLAGS carry /arch:AVX2 on AMD64 only (empty on Win32); CMake seeds these
        # into both the AMReX pre-build and the ImpactX wheel. No explicit vir-simd SIMD on MSVC.
        # _DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR reverts VS 2022 17.10's constexpr
        # std::mutex ctor, which NULL-derefs in an older SYSTEM msvcp140.dll (we
        # --exclude the vendored copy) -- the 0xC0000005 at amrex_3d_pybind import.
        CIBW_ENVIRONMENT_WINDOWS: IMPACTX_CMAKE_HDF5_USE_STATIC_LIBRARIES='ON' IMPACTX_AMREX_INTERNAL='OFF' IMPACTX_CMAKE_ImpactX_openpmd_internal='OFF' IMPACTX_COMPUTE='NOACC' IMPACTX_FFT='ON' CFLAGS='${{ matrix.env.WHEEL_ARCHFLAGS }}' CXXFLAGS='${{ matrix.env.WHEEL_ARCHFLAGS }} /D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR' ZLIB_USE_STATIC_LIBS='ON' CMAKE_INTERPROCEDURAL_OPTIMIZATION='OFF' CMAKE_PREFIX_PATH='C:/Program Files (x86)/AMReX;C:/Program Files (x86)/fftw;C:/Program Files (x86)/HDF5;C:/Program Files (x86)/zlib;C:/Program Files (x86)/openPMD'
        # pyAMReX links the shared AMReX runtime on Windows -> vendor that DLL,
        # but --exclude the MSVC C++ runtime: a private copy collides
        # with co-loaded C++ extensions in other imports and causes heap corruption.
        # --exclude takes glob wildcards (delvewheel docs); unversioned families
        # stay correct across runtime updates / a future toolset (msvcp150, ...).
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
          delvewheel repair --add-path "C:\Program Files (x86)\AMReX\bin" -v -w {dest_dir} {wheel}
          --exclude "msvcp*.dll;vcruntime*.dll;concrt*.dll;vccorlib*.dll;vcomp*.dll;vcamp*.dll;msvcr*.dll"
        CMAKE_BUILD_PARALLEL_LEVEL: "${{ matrix.env.CMAKE_BUILD_PARALLEL_LEVEL }}"
        # C++17 support in macOS 10.13+ (partial) and 10.14+ (std::visit) and 10.15+ (std::filesystem::path)
        #   https://cibuildwheel.readthedocs.io/en/stable/cpp_standards/#macos-and-deployment-target-versions
        # arm64/aarch64 (M1/M2) requires 11.0+
        MACOSX_DEPLOYMENT_TARGET: "${{ matrix.env.MACOSX_DEPLOYMENT_TARGET }}"
        CMAKE_OSX_ARCHITECTURES: "${{ matrix.env.CMAKE_OSX_ARCHITECTURES }}"
        # Windows cross-compilation
        CMAKE_GENERATOR: "${{ matrix.env.CMAKE_GENERATOR }}"
        CMAKE_GENERATOR_PLATFORM: "${{ matrix.env.CMAKE_GENERATOR_PLATFORM }}"
        # Show a bit more output (pip -v)
        CIBW_BUILD_VERBOSITY: 1
        # Testing of the final wheel: shared-lib deps (check_wheel_libs.py), the
        # push unit test, and smoke_example.py -- runs a FODO example and reads its
        # openPMD beam monitor back with the openpmd_api wheel co-loaded in the same
        # process (the co-load that crashed on macOS before impactx#1538).
        # Neither pandas nor h5py ships 32-bit wheels (win32/i686) and neither builds
        # from source in-CI: pandas is only a lazy import in impactx, and the h5py
        # co-load is skipped at its call site in smoke_example.py.
        CIBW_TEST_REQUIRES: "${{ (matrix.arch == 'x86' || matrix.arch == 'i686') && 'pytest numpy openpmd-api' || 'pytest numpy pandas openpmd-api h5py' }}"
        CIBW_TEST_COMMAND: >
          python {project}/.github/check_wheel_libs.py &&
          pytest {project}/tests/python/test_push.py &&
          python {project}/.github/smoke_example.py &&
          python {project}/.github/smoke_example.py --with-h5py
      run: |
        cd src
        python -m pip install --upgrade pip build setuptools[core] wheel
        python -m pip install --upgrade cmake
        python -m cibuildwheel --output-dir ../wheelhouse

      # note - intentionally skipping a source package
      # python setup.py sdist --dist-dir ../wheelhouse

    - uses: actions/upload-artifact@v4
      name: Publish as GitHub artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse
        overwrite: true

    - name: Check wheels do not vendor the VC++ runtime
      if: runner.os == 'Windows'
      shell: bash
      run: |
        for whl in wheelhouse/*.whl; do
          python src/.github/check_no_vendored_runtime.py "$whl"
        done

    - name: Publish on pypi.org
      if: github.event_name == 'push' && github.repository == 'BLAST-ImpactX/impactx-wheels' && github.ref == 'refs/heads/wheels-noacc'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.pypa_gh_action_upload }}
      run: |
        python -m pip install -U twine
        python -m twine upload --skip-existing wheelhouse/*
